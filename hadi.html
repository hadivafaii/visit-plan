<style>
:root{--bg:#FBF6F0;--surface:#FFFFFF;--ink:#2B2420;--muted:#76685D;--line:#E6D9CC;--accent:#C4472D;--accent-ink:#FFFFFF;--sea:#2D6A6F;--sea-soft:#DFEEEC;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161211;--surface:#211B19;--ink:#F3EBE4;--muted:#B4A69B;--line:#3A302C;--accent:#EF7B5D;--accent-ink:#1A100D;--sea:#86C6C8;--sea-soft:#1E3334;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:360px;text-align:center}
.lock{font-size:34px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:32px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);outline:none;text-align:center}
input[type=password]:focus{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:15px;margin:14px 0}
.rem input{width:18px;height:18px;accent-color:var(--sea)}
button{width:100%;font:inherit;font-weight:600;font-size:17px;border:0;border-radius:14px;min-height:52px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.5}
#msg{min-height:24px;margin:14px 0 0;color:var(--muted)}
</style>

function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
function put(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
var form = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), rem = document.getElementById("rem"), msg = document.getElementById("msg");
function unlock(pass, remember) {
  if (!window.crypto || !crypto.subtle || !window.TextEncoder) return Promise.reject(new Error("nocrypto"));
  pass = pass.normalize ? pass.normalize("NFC") : pass;
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function (base) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })

        var token = hex(t);
        try { sessionStorage.setItem(P.page + ".token", token); } catch (e) {}
        if (remember) { put(P.page + ".pw", pass); put(P.page + ".token", token); }
        var html = new TextDecoder().decode(pt);
        document.open(); document.write(html); document.close();
      });
    });
}
form.addEventListener("submit", function (e) {

  unlock(pw.value, rem.checked).catch(function (err) {

    pw.select();
  });
});

if (saved) {
  go.disabled = true; msg.textContent = "Opening…";
  unlock(saved, true).catch(function () { put(P.page + ".pw", null); put(P.page + ".token", null); go.disabled = false; msg.textContent = ""; });
}
